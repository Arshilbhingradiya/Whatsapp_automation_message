<!DOCTYPE html>
<html>
  <head>
    <title>WhatsApp Invitation Sender</title>

      ></textarea>
    </div>

      <button id="btnSend">🚀 Send Invitations</button>
    </div>
    <hr />
    <h3>Logs</h3>
    <div id="log"></div>

    <div id="progress"></div>
